<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca</title>
  <!-- Icono y nombre al guardarla en la pantalla de inicio -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1C1917">
  <meta name="apple-mobile-web-app-title" content="Biblioteca">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="tema.css">
</head>
<body>
  <main>
    <header id="portada">
      <h1 id="titulo-biblioteca"></h1>
      <p id="cifra">Cargando libros…</p>
      <p id="lema">Y contando.</p>
      <p id="resumen" class="suave"></p>
    </header>

    <form id="acceso" hidden>
      <p class="caja-titulo">Esta biblioteca es de la familia.</p>
      <p class="suave">Escribe la contraseña de la casa para entrar.</p>
      <label class="campo">Contraseña de la casa
        <input id="clave" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
      </label>
      <p id="acceso-aviso" class="aviso" role="alert"></p>
      <button id="acceso-entrar" type="submit" class="primario">Entrar</button>
    </form>

    <form id="buscador" role="search">
      <input id="consulta" type="search" placeholder="¿Qué libro buscas?" autocomplete="off" enterkeyhint="search">
      <button id="camara" type="button" aria-label="Escanear el código de barras">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Escanear</span>
      </button>
    </form>

    <div id="escaneado" hidden></div>
    <div id="veredicto" hidden></div>
    <button id="cotillea" type="button" hidden>Ver la estantería</button>
    <div id="resultados"></div>
  </main>

  <div id="aviso-flotante" role="status" aria-live="polite" hidden></div>

  <div id="escaner" class="capa" hidden>
    <div class="caja">
      <p class="caja-titulo">Dale la vuelta al libro.</p>
      <p class="suave">Enfoca el código de barras de la contraportada.</p>
      <div id="lector"></div>
      <p id="escaner-aviso" class="suave"></p>
      <button id="escaner-cerrar" type="button" class="secundario">Cancelar</button>
    </div>
  </div>

  <div id="formulario" class="capa" hidden>
    <form id="form" class="caja" novalidate>
      <p id="form-titulo" class="caja-titulo">Apúntalo.</p>
      <p id="form-sub" class="suave"></p>
      <div id="form-libro">
        <div class="opciones">
          <label><input type="radio" name="estado" value="Reservado"><span>Se lo voy a regalar</span></label>
          <label><input type="radio" name="estado" value="En casa"><span>Ya está en casa</span></label>
        </div>
        <label class="campo">Título<input name="titulo" maxlength="200" autocomplete="off"></label>
        <label class="campo">Autor<input name="autor" maxlength="200" autocomplete="off"></label>
        <label id="campo-isbn" class="campo">ISBN <span class="suave">· opcional, rellena el resto solo</span><input name="isbn" inputmode="numeric" maxlength="17" autocomplete="off"></label>
      </div>
      <label id="form-nombre" class="campo">Tu nombre <span class="suave">· opcional, solo lo verán los padres</span><input name="nombre" maxlength="60" autocomplete="given-name"></label>
      <p id="form-aviso" class="aviso"></p>
      <button id="form-enviar" type="submit" class="primario">Apuntarlo</button>
      <button id="form-cerrar" type="button" class="secundario">Cancelar</button>
    </form>
  </div>

  <script src="config.js"></script>
  <script src="textos.js"></script>
  <script src="datos-ejemplo.js"></script>
  <script src="app.js"></script>
</body>
</html>
