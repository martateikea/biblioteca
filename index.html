<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca</title>
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <header id="portada">
      <p id="cifra">…</p>
      <p id="lema">Y contando.</p>
      <p id="resumen" class="suave">Cargando libros…</p>
    </header>

    <form id="buscador" role="search">
      <input id="consulta" type="search" placeholder="¿Qué libro tienes en mente?" autocomplete="off" enterkeyhint="search">
      <button id="camara" type="button" aria-label="Escanear código de barras">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
    </form>

    <div id="veredicto" hidden></div>
    <button id="cotillea" type="button" hidden>Cotillea su biblioteca</button>
    <ul id="resultados"></ul>
  </main>

  <script src="config.js"></script>
  <script src="datos-ejemplo.js"></script>
  <script src="app.js"></script>
</body>
</html>
